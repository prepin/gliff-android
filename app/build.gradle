plugins { id 'com.android.application' }

android {
    namespace 'org.omarchy.gliff'
    compileSdk 36
    defaultConfig {
        applicationId 'org.omarchy.gliff'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'org.omarchy.gliff.DeviceChecks'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    packaging {
        resources.excludes += ['META-INF/versions/**', 'META-INF/DEPENDENCIES']
    }
    lint { abortOnError true }
}

dependencies {
    implementation 'com.github.mwiede:jsch:2.28.8'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.23.0'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-cbor:2.23.0'
    testImplementation 'junit:junit:4.13.2'
}

def licenseAssets = layout.buildDirectory.dir('generated/licenseAssets')
android.sourceSets.main.assets.srcDir(licenseAssets)
tasks.register('collectLicenses') {
    inputs.files(configurations.debugRuntimeClasspath)
    inputs.files(rootProject.file('LICENSE'), rootProject.file('NOTICE'))
    outputs.dir(licenseAssets)
    doLast {
        copy {
            from(rootProject.file('LICENSE'), rootProject.file('NOTICE'))
            into(new File(licenseAssets.get().asFile, 'licenses/gliff-android'))
        }
        configurations.debugRuntimeClasspath.files.each { jar ->
            copy {
                from(zipTree(jar))
                include 'META-INF/*LICENSE*', 'META-INF/*NOTICE*'
                into(new File(licenseAssets.get().asFile, "licenses/${jar.name}"))
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'collectLicenses' }
